name: "Network Formation — Strategic Linking"
description: "Agents with diverse linking strategies form a network; payoffs depend on network position"
game: network_formation
rounds: 100
seed: 42

game_params:
  link_cost: 5.0
  direct_benefit: 10.0
  decay_factor: 0.5

agents:
  - name: connector
    strategy: fully_connected

  - name: hermit
    strategy: isolationist

  - name: random_1
    strategy: random_linker
    parameters:
      k: 2

  - name: popular
    strategy: popularity_based
    parameters:
      k: 3

  - name: best_resp
    strategy: best_response_linker

  - name: star
    strategy: star_seeker
